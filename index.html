<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Embelis Paysage</title>

<style>

/* =========================
   BASE
========================= */

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f3f5f2;
color:#1d2a21;
}

header{
background:#173d28;
color:white;
padding:18px 22px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:21px;
font-weight:bold;
}

.subtitle{
font-size:12px;
opacity:.7;
margin-top:3px;
}

.container{
max-width:1450px;
margin:auto;
padding:20px;
}


/* =========================
   BOUTONS
========================= */

button{
border:0;
border-radius:8px;
padding:10px 14px;
font-weight:bold;
cursor:pointer;
}

.primary{
background:#d4ed63;
color:#173d28;
}

.secondary{
background:white;
color:#173d28;
border:1px solid #ddd;
}

.danger{
background:#ffe1df;
color:#9b2822;
}


/* =========================
   BARRE OUTILS
========================= */

.toolbar{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:15px;
}

select,
input,
textarea{
font-family:inherit;
}


/* =========================
   STATISTIQUES
========================= */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-bottom:18px;
}

.card{
background:white;
border-radius:14px;
padding:16px;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.stat-number{
font-size:28px;
font-weight:bold;
margin-top:5px;
}


/* =========================
   LEGENDE
========================= */

.legend{
display:flex;
gap:18px;
flex-wrap:wrap;
align-items:center;
margin-bottom:15px;
}

.legend-title{
font-weight:bold;
}

.legend-item{
display:flex;
align-items:center;
gap:6px;
font-size:13px;
}

.legend-color{
width:13px;
height:13px;
border-radius:50%;
}


/* =========================
   COULEURS
========================= */

.color-entretien{
background:#78a94a;
}

.color-elagage{
background:#4b82c2;
}

.color-creation{
background:#df9739;
}

.color-plantation{
background:#8d63b8;
}

.color-arrosage{
background:#8b6a45;
}

.color-urgence{
background:#d94b45;
}


/* =========================
   PLANNING
========================= */

.planning-wrapper{
overflow-x:auto;
}

.planning{
min-width:950px;
display:grid;
grid-template-columns:160px repeat(5,1fr);
gap:1px;
background:#dce3dc;
border-radius:12px;
overflow:hidden;
}

.cell{
background:white;
padding:10px;
min-height:150px;
}

.header-cell{
background:#eaf0e9;
min-height:auto;
font-weight:bold;
}

.team{
font-weight:bold;
}

.team-dot{
display:inline-block;
width:10px;
height:10px;
background:#79a64b;
border-radius:50%;
margin-right:7px;
}

.team-members{
font-size:11px;
color:#78847b;
margin-top:5px;
}

.free{
color:#a1aaa4;
font-size:12px;
margin-top:10px;
}


/* =========================
   CHANTIER
========================= */

.job{
padding:9px;
border-radius:9px;
margin-top:7px;
font-size:12px;
cursor:grab;
border-left:4px solid;
background:white;
}

.job:active{
cursor:grabbing;
}

.job.entretien{
background:#eaf7e5;
border-left-color:#78a94a;
}

.job.elagage{
background:#eaf2ff;
border-left-color:#4b82c2;
}

.job.creation{
background:#fff0dc;
border-left-color:#df9739;
}

.job.plantation{
background:#f0e7f8;
border-left-color:#8d63b8;
}

.job.arrosage{
background:#f3ece3;
border-left-color:#8b6a45;
}

.job.urgence{
background:#ffe6e4;
border-left-color:#d94b45;
}

.job-title{
font-weight:bold;
font-size:13px;
}

.job-type{
margin-top:2px;
}

.job-time{
color:#69746c;
margin-top:5px;
font-size:11px;
}

.job-notes{
color:#6b756e;
margin-top:4px;
font-size:10px;
font-style:italic;
}


/* =========================
   HEURES SUP
========================= */

.section-title{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:25px;
}

.overtime{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.badge{
display:inline-block;
background:#fff0c6;
padding:5px 9px;
border-radius:20px;
font-size:11px;
margin:8px 0;
}


/* =========================
   MODALE
========================= */

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:100;
}

.modal{
background:white;
border-radius:15px;
padding:22px;
max-width:500px;
width:100%;
max-height:90vh;
overflow:auto;
}

.modal h2{
margin-top:0;
}

.form-group{
margin-bottom:12px;
}

.form-group label{
display:block;
font-weight:bold;
font-size:13px;
margin-bottom:5px;
}

.form-input{
width:100%;
padding:11px;
border:1px solid #ddd;
border-radius:8px;
}

textarea.form-input{
min-height:80px;
resize:vertical;
}

.form-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.modal-actions{
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:18px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

.stats{
grid-template-columns:repeat(2,1fr);
}

.overtime{
grid-template-columns:1fr;
}

header{
padding:15px;
}

.container{
padding:12px;
}

.legend{
gap:10px;
}

.form-row{
grid-template-columns:1fr;
}

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

<div>

<div class="logo">
🌿 Embelis Paysage
</div>

<div class="subtitle">
Planning opérationnel — V1.1
</div>

</div>

<button
class="primary"
onclick="openNewJob()">

+ Nouveau chantier

</button>

</header>


<div class="container">


<!-- =========================
     OUTILS
========================= -->

<div class="toolbar">

<button
class="secondary"
onclick="previousWeek()">

‹ Semaine précédente

</button>


<button
class="secondary"
onclick="currentWeek()">

Aujourd'hui

</button>


<button
class="secondary"
onclick="nextWeek()">

Semaine suivante ›

</button>


<select
id="teamFilter"
onchange="renderPlanning()"
style="
padding:10px;
border-radius:8px;
border:1px solid #ddd;
">

<option value="all">
Toutes les équipes
</option>

<option value="1">
Équipe 1
</option>

<option value="2">
Équipe 2
</option>

<option value="3">
Équipe 3
</option>

</select>


<button
class="secondary"
onclick="sendNotifications()">

🔔 Notifications

</button>

</div>


<!-- =========================
     STATS
========================= -->

<div class="stats">


<div class="card">

<div>
Chantiers cette semaine
</div>

<div
class="stat-number"
id="jobCount">

8

</div>

</div>


<div class="card">

<div>
Employés planifiés
</div>

<div class="stat-number">

7

</div>

</div>


<div class="card">

<div>
Heures supplémentaires
</div>

<div
class="stat-number"
id="overtimeCount">

2

</div>

</div>


<div class="card">

<div>
Alertes planning
</div>

<div class="stat-number">

1

</div>

</div>


</div>


<!-- =========================
     LEGENDE
========================= -->

<div class="card legend">


<div class="legend-title">
Légende :
</div>


<div class="legend-item">

<span class="legend-color color-entretien"></span>

Entretien

</div>


<div class="legend-item">

<span class="legend-color color-elagage"></span>

Élagage

</div>


<div class="legend-item">

<span class="legend-color color-creation"></span>

Création

</div>


<div class="legend-item">

<span class="legend-color color-plantation"></span>

Plantation

</div>


<div class="legend-item">

<span class="legend-color color-arrosage"></span>

Arrosage

</div>


<div class="legend-item">

<span class="legend-color color-urgence"></span>

Urgence

</div>


</div>


<!-- =========================
     PLANNING
========================= -->

<div class="card planning-wrapper">

<div
id="planning"
class="planning">

</div>

</div>


<!-- =========================
     HEURES SUP
========================= -->

<div class="section-title">

<h2>
⏱️ Heures supplémentaires
</h2>

<span
style="
font-size:12px;
color:#718078;
">

Validation responsable

</span>

</div>


<div
id="overtime"
class="overtime">

</div>


</div>


<!-- =========================
     MODALE
========================= -->

<div
id="overlay"
class="overlay"
onclick="closeModal(event)">

<div
id="modal"
class="modal">

</div>

</div>


<script>


/* =========================
   VARIABLES
========================= */

let weekOffset=0;


/* =========================
   EQUIPES
========================= */

const teams=[

{
id:1,
name:"Équipe 1",
members:"Julien · Marc · Paul"
},

{
id:2,
name:"Équipe 2",
members:"Thomas · Kevin"
},

{
id:3,
name:"Équipe 3",
members:"Antoine · Lucas"
}

];


/* =========================
   TYPES DE CHANTIER
========================= */

const jobTypes={

"entretien":{
label:"Entretien",
className:"entretien"
},

"elagage":{
label:"Élagage",
className:"elagage"
},

"creation":{
label:"Création",
className:"creation"
},

"plantation":{
label:"Plantation",
className:"plantation"
},

"arrosage":{
label:"Arrosage",
className:"arrosage"
},

"urgence":{
label:"Urgence",
className:"urgence"
}

};


/* =========================
   CHANTIERS DEMO
========================= */

let jobs=[

{
id:1,
team:1,
day:0,
name:"Résidence Prado",
type:"entretien",
timeStart:"7h30",
timeEnd:"16h30",
notes:"Taille de haies"
},

{
id:2,
team:1,
day:1,
name:"Résidence Prado",
type:"entretien",
timeStart:"7h30",
timeEnd:"16h30",
notes:"Entretien général"
},

{
id:3,
team:1,
day:2,
name:"Villa Roucas",
type:"entretien",
timeStart:"8h00",
timeEnd:"16h30",
notes:"Entretien du jardin"
},

{
id:4,
team:2,
day:0,
name:"Chantier Castellane",
type:"creation",
timeStart:"7h30",
timeEnd:"17h00",
notes:"Création paysagère"
},

{
id:5,
team:2,
day:1,
name:"Chantier Castellane",
type:"creation",
timeStart:"7h30",
timeEnd:"17h00",
notes:"Suite création"
},

{
id:6,
team:2,
day:2,
name:"Déchèterie",
type:"entretien",
timeStart:"8h00",
timeEnd:"12h00",
notes:"Évacuation — exemple uniquement"
},

{
id:7,
team:3,
day:3,
name:"Jardin Mazargues",
type:"plantation",
timeStart:"7h30",
timeEnd:"16h30",
notes:"Plantation"
},

{
id:8,
team:3,
day:4,
name:"Jardin Mazargues",
type:"arrosage",
timeStart:"7h30",
timeEnd:"16h30",
notes:"Arrosage"
}

];


/* =========================
   HEURES SUP
========================= */

let overtimeRequests=[

{
id:1,
employee:"Julien",
job:"Résidence Prado",
hours:"1h15",
reason:"Travail supplémentaire"
},

{
id:2,
employee:"Thomas",
job:"Chantier Castellane",
hours:"0h45",
reason:"Préparation supplémentaire"
}

];


/* =========================
   DATES
========================= */

function getDates(){

let date=new Date();

let day=
(date.getDay()+6)%7;

date.setDate(
date.getDate()
-day
+(weekOffset*7)
);

const names=[
"Lundi",
"Mardi",
"Mercredi",
"Jeudi",
"Vendredi"
];

return names.map(

(name,index)=>{

let d=new Date(date);

d.setDate(
date.getDate()+index
);

return name+" "+
String(d.getDate()).padStart(2,"0")+
"/"+
String(d.getMonth()+1).padStart(2,"0");

}

);

}


/* =========================
   PLANNING
========================= */

function renderPlanning(){

const filter=
document.getElementById(
"teamFilter"
).value;

const dates=
getDates();

const planning=
document.getElementById(
"planning"
);

planning.innerHTML="";


planning.innerHTML+=

`<div class="cell header-cell">
Équipe
</div>`;


dates.forEach(date=>{

planning.innerHTML+=

`<div class="cell header-cell">
${date}
</div>`;

});


teams
.filter(team=>

filter==="all"
||
filter==team.id

)
.forEach(team=>{


planning.innerHTML+=

`<div class="cell team">

<div>

<span class="team-dot"></span>

${team.name}

</div>

<div class="team-members">

${team.members}

</div>

</div>`;


for(
let day=0;
day<5;
day++
){


const dayJobs=

jobs.filter(job=>

job.team===team.id
&&
job.day===day

);


let content="";


if(
dayJobs.length===0
){

content=

`<div class="free">
Libre
</div>`;

}


dayJobs.forEach(job=>{


const type=
jobTypes[job.type];


content+=

`<div
class="job ${type.className}"
draggable="true"
ondragstart="drag(event,${job.id})"
onclick="showJob(${job.id})"
>

<div class="job-title">

${job.name}

</div>


<div class="job-type">

${type.label}

</div>


<div class="job-time">

${job.timeStart}
–
${job.timeEnd}

</div>


${
job.notes
?
`<div class="job-notes">
${job.notes}
</div>`
:
""
}

</div>`;

});


planning.innerHTML+=

`<div
class="cell"
ondragover="allowDrop(event)"
ondrop="drop(event,${team.id},${day})"
>

${content}

</div>`;

}

});


document.getElementById(
"jobCount"
).textContent=
jobs.length;


renderOvertime();

}


/* =========================
   DRAG DROP
========================= */

function allowDrop(event){

event.preventDefault();

}


function drag(event,id){

event.dataTransfer.setData(
"jobId",
id
);

}


function drop(
event,
teamId,
day
){

event.preventDefault();


const id=
Number(
event.dataTransfer
.getData("jobId")
);


const job=
jobs.find(
item=>item.id===id
);


if(!job)return;


job.team=
teamId;

job.day=
day;


renderPlanning();


alert(

"Planning modifié.\n\n"+
"Les employés concernés pourront "+
"être notifiés dans une prochaine version."

);

}


/* =========================
   SEMAINES
========================= */

function previousWeek(){

weekOffset--;

renderPlanning();

}


function nextWeek(){

weekOffset++;

renderPlanning();

}


function currentWeek(){

weekOffset=0;

renderPlanning();

}


/* =========================
   NOUVEAU CHANTIER
========================= */

function openNewJob(){


document.getElementById(
"modal"
).innerHTML=

`

<h2>
Nouveau chantier
</h2>


<div class="form-group">

<label>
Nom du chantier
</label>

<input
id="newJobName"
class="form-input"
placeholder="Ex : Villa Dupont"
>

</div>


<div class="form-group">

<label>
Type d'intervention
</label>

<select
id="newJobType"
class="form-input"
>

<option value="entretien">
🟢 Entretien
</option>

<option value="elagage">
🔵 Élagage
</option>

<option value="creation">
🟠 Création
</option>

<option value="plantation">
🟣 Plantation
</option>

<option value="arrosage">
🟤 Arrosage
</option>

<option value="urgence">
🔴 Urgence
</option>

</select>

</div>


<div class="form-row">


<div class="form-group">

<label>
Jour
</label>

<select
id="newJobDay"
class="form-input"
>

<option value="0">
Lundi
</option>

<option value="1">
Mardi
</option>

<option value="2">
Mercredi
</option>

<option value="3">
Jeudi
</option>

<option value="4">
Vendredi
</option>

</select>

</div>


<div class="form-group">

<label>
Équipe
</label>

<select
id="newJobTeam"
class="form-input"
>

<option value="1">
Équipe 1
</option>

<option value="2">
Équipe 2
</option>

<option value="3">
Équipe 3
</option>

</select>

</div>


</div>


<div class="form-row">


<div class="form-group">

<label>
Début
</label>

<input
id="newJobStart"
class="form-input"
value="7h30"
>

</div>


<div class="form-group">

<label>
Fin
</label>

<input
id="newJobEnd"
class="form-input"
value="16h30"
>

</div>


</div>


<div class="form-group">

<label>
Notes
</label>

<textarea
id="newJobNotes"
class="form-input"
placeholder="Informations utiles pour l'équipe..."
></textarea>

</div>


<div class="modal-actions">

<button
class="secondary"
onclick="closeModal()">

Annuler

</button>


<button
class="primary"
onclick="createJob()">

Ajouter au planning

</button>

</div>

`;


document.getElementById(
"overlay"
).style.display=
"flex";

}


/* =========================
   CREATION
========================= */

function createJob(){


const name=
document.getElementById(
"newJobName"
).value.trim();


if(!name){

alert(
"Indique le nom du chantier."
);

return;

}


const type=
document.getElementById(
"newJobType"
).value;


const day=
Number(
document.getElementById(
"newJobDay"
).value
);


const team=
Number(
document.getElementById(
"newJobTeam"
).value
);


const timeStart=
document.getElementById(
"newJobStart"
).value
||
"7h30";


const timeEnd=
document.getElementById(
"newJobEnd"
).value
||
"16h30";


const notes=
document.getElementById(
"newJobNotes"
).value;


jobs.push({

id:Date.now(),

team:team,

day:day,

name:name,

type:type,

timeStart:timeStart,

timeEnd:timeEnd,

notes:notes

});


closeModal();

renderPlanning();


alert(
"Chantier ajouté au planning."
);

}


/* =========================
   DETAIL CHANTIER
========================= */

function showJob(id){


const job=
jobs.find(
item=>item.id===id
);


if(!job)return;


const team=
teams.find(
item=>item.id===job.team
);


const type=
jobTypes[job.type];


document.getElementById(
"modal"
).innerHTML=

`

<h2>
${job.name}
</h2>


<p>

<strong>
Type :
</strong>

${type.label}

</p>


<p>

<strong>
Équipe :
</strong>

${team.name}

</p>


<p>

<strong>
Horaire :
</strong>

${job.timeStart}
–
${job.timeEnd}

</p>


<p>

<strong>
Notes :
</strong>

<br>

${job.notes || "Aucune note"}

</p>


<div class="modal-actions">

<button
class="secondary"
onclick="closeModal()">

Fermer

</button>

</div>

`;


document.getElementById(
"overlay"
).style.display=
"flex";

}


/* =========================
   HEURES SUP
========================= */

function renderOvertime(){

const container=
document.getElementById(
"overtime"
);

container.innerHTML="";


document.getElementById(
"overtimeCount"
).textContent=
overtimeRequests.length;


overtimeRequests.forEach(
request=>{


container.innerHTML+=

`

<div class="card">

<strong>

${request.employee}
—
${request.hours}

</strong>


<p>

${request.job}

</p>


<small>

${request.reason}

</small>


<br>


<span class="badge">

À valider

</span>


<br>


<button
class="primary"
onclick="validateOvertime(${request.id})">

✓ Valider

</button>


<button
class="danger"
onclick="refuseOvertime(${request.id})">

Refuser

</button>


</div>

`;

});

}


function validateOvertime(id){

overtimeRequests=
overtimeRequests.filter(
item=>item.id!==id
);

renderPlanning();


alert(
"Heures supplémentaires validées."
);

}


function refuseOvertime(id){

overtimeRequests=
overtimeRequests.filter(
item=>item.id!==id
);

renderPlanning();


alert(
"Heures supplémentaires refusées."
);

}


/* =========================
   NOTIFICATIONS
========================= */

function sendNotifications(){

alert(

"🔔 NOTIFICATIONS\n\n"+

"Les employés concernés par une "+
"modification seront notifiés ici.\n\n"+

"Les notifications réelles seront "+
"connectées dans une prochaine version."

);

}


/* =========================
   FERMETURE MODALE
========================= */

function closeModal(event){

if(
event &&
event.target !==
document.getElementById("overlay")
){

return;

}


document.getElementById(
"overlay"
).style.display=
"none";

}


/* =========================
   INITIALISATION
========================= */

renderPlanning();

</script>

</body>

</html>
